<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>EVT Viewer</title>
  <script>
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname +
      (l.port ? ':' + l.port : '') +
      '/?/' +
      l.pathname.slice(1) +
      (l.search ? '&' + l.search.slice(1) : '') +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
